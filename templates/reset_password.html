<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f8f6;
            --card: #ffffff;
            --text: #1f3a2d;
            --muted: #5f766c;
            --accent: #1f8a5f;
            --accent-dark: #176947;
            --danger: #c0392b;
            --border: #d7e4dd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top, #e8f3ee 0%, var(--bg) 60%);
            font-family: "DM Sans", sans-serif;
            color: var(--text);
        }

        .card {
            width: min(100%, 460px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 18px 45px rgba(23, 74, 53, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-family: "Playfair Display", serif;
            font-size: 32px;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.6;
        }

        .message {
            margin-bottom: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #eef7f2;
            color: var(--text);
        }

        .message.error {
            background: #fdecea;
            color: var(--danger);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font: inherit;
        }

        button,
        a {
            font: inherit;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px 16px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .link {
            display: inline-block;
            margin-top: 16px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reset Password</h1>
        <p>Use the form below to choose a new password for your admin account.</p>

        {% if message %}
            <div class="message {% if not valid %}error{% endif %}">{{ message }}</div>
        {% endif %}

        {% if valid and not success %}
            <form method="post">
                <label for="password">New Password</label>
                <input id="password" name="password" type="password" minlength="8" required>

                <label for="confirm_password">Confirm Password</label>
                <input id="confirm_password" name="confirm_password" type="password" minlength="8" required>

                <button type="submit">Update Password</button>
            </form>
        {% endif %}

        <a class="link" href="{{ url_for('main.home', view='login') }}">Return to login</a>
    </div>
</body>
</html>
